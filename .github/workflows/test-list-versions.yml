---
name: Test list-versions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: list
        uses: ./list-versions
      - name: Check default output
        env:
          VERSIONS: ${{ steps.list.outputs.versions }}
          LATEST: ${{ steps.list.outputs.latest }}
          COUNT: ${{ steps.list.outputs.count }}
        run: |
          set -euo pipefail
          echo "latest=$LATEST count=$COUNT"
          echo "$VERSIONS" | jq -e 'type == "array" and length > 0' >/dev/null
          [ -n "$LATEST" ]
          [ "$COUNT" -gt 0 ]
          # latest must be the first element of the array
          [ "$(echo "$VERSIONS" | jq -r '.[0]')" = "$LATEST" ]
          # count must equal the array length
          [ "$(echo "$VERSIONS" | jq 'length')" = "$COUNT" ]
  test-families:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: list
        uses: ./list-versions
        with:
          version-families: |
            3.1
            3.2
      - name: Check family filter
        env:
          VERSIONS: ${{ steps.list.outputs.versions }}
          COUNT: ${{ steps.list.outputs.count }}
        run: |
          set -euo pipefail
          echo "filtered: $VERSIONS"
          [ "$COUNT" -gt 0 ]
          # every entry must be exactly 3.1/3.2, or start with 3.1./3.2. (not 3.20)
          bad="$(echo "$VERSIONS" | jq -r '.[] | select((. != "3.1") and (. != "3.2") and (startswith("3.1.") | not) and (startswith("3.2.") | not))')"
          if [ -n "$bad" ]; then
            echo "::error::Unexpected versions leaked through family filter: $bad"
            exit 1
          fi
  test-list-versions-mark:
    if: always()
    needs:
      - test-all
      - test-families
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          jobs: ${{ toJSON(needs) }}